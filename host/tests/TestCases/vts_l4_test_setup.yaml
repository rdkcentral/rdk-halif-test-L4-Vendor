# Setup for the AV L4 pipeline test (vts_l4_test.py).
VTS:
  description: "AV L4 pipeline test setup"
  num_of_instances: 1
  # UT Core suites to run, in this order. Each name must be a suite registered in src/vts_audio_video.cpp.
  suites:
    - NormalPlayback
    - PauseResume
    - Seek
    - MetadataPropagation
  test:
    # Bundle built by build-arm.sh (arm-deps/make-device-bundle.py), relative to this directory.
    artifacts:
      - "../../../build-arm/device/l4-rdk-audio-video.tar.gz"
    # Runs the device binary from the bundle directory. run.sh sets L4_CONFIG and LD_LIBRARY_PATH.
    execute: "./run.sh"
    type: UT-C
